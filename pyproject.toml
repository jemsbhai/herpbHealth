[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "herpb-health"
version = "0.1.0"
description = "Privacy-preserving RAG for healthcare using two-server additive secret sharing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Muntaser Syed"},
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "transformers>=4.30",
    "sentence-transformers>=2.2",
    "datasets>=2.14",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
